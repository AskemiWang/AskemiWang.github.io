<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>知识图谱 · 47 节点 / 50 边</title>
<style>
  /* ---------------------------------------------------------------- tokens */
  :root{
    color-scheme:light;
    --bg:#f6f5f1;
    --bg-2:#eeebe4;
    --ink:#16171b;
    --ink-2:#4c4e57;
    --ink-3:#878993;
    --line:rgba(22,23,27,.10);
    --line-2:rgba(22,23,27,.16);
    --glass:rgba(255,255,255,.74);
    --glass-2:rgba(255,255,255,.9);
    --hover:rgba(22,23,27,.055);
    --accent:#2f4bd0;
    --accent-soft:rgba(47,75,208,.1);
    --canvas:var(--bg);
    --shadow:0 1px 2px rgba(20,22,30,.04),0 10px 30px rgba(20,22,30,.08);
    --shadow-lg:0 2px 10px rgba(20,22,30,.06),0 30px 70px rgba(20,22,30,.14);
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --ease:cubic-bezier(.22,.8,.2,1);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0c0e12;
    --bg-2:#12151b;
    --ink:#eceef3;
    --ink-2:#a9aeba;
    --ink-3:#6e7482;
    --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.17);
    --glass:rgba(18,21,28,.72);
    --glass-2:rgba(20,23,30,.92);
    --hover:rgba(255,255,255,.06);
    --accent:#93a6ff;
    --accent-soft:rgba(147,166,255,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
    --shadow-lg:0 2px 12px rgba(0,0,0,.4),0 34px 80px rgba(0,0,0,.55);
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font:13px/1.5 var(--font);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1000px 640px at 10% -8%, rgba(255,255,255,.95), transparent 62%),
      radial-gradient(900px 620px at 104% 108%, var(--accent-soft), transparent 60%),
      var(--bg);
  }
  html[data-theme="dark"] body::before{
    background:
      radial-gradient(1000px 640px at 10% -8%, rgba(120,140,255,.10), transparent 62%),
      radial-gradient(820px 560px at 104% 108%, rgba(120,140,255,.07), transparent 60%),
      var(--bg);
  }
  #grid{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.55;
    background-image:radial-gradient(circle at 1px 1px, rgba(22,23,27,.15) 1px, transparent 0);
    background-size:28px 28px;
    -webkit-mask-image:radial-gradient(ellipse 82% 72% at 50% 46%, #000 32%, transparent 100%);
            mask-image:radial-gradient(ellipse 82% 72% at 50% 46%, #000 32%, transparent 100%);
  }
  html[data-theme="dark"] #grid{
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.14) 1px, transparent 0);
  }

  /* ---------------------------------------------------------------- stage */
  #svg{
    position:fixed;inset:0;z-index:2;width:100%;height:100%;display:block;
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  }
  #svg.panning{cursor:grabbing}
  #svg.dragging{cursor:grabbing}
  .node{cursor:pointer}
  .node .hit{fill:transparent}
  .node .dot,.node .halo{transition:fill .2s ease,stroke .2s ease}
  .edge{fill:none;stroke-linecap:round;transition:opacity .18s ease,stroke-width .18s ease}
  #edges{mix-blend-mode:multiply}
  html[data-theme="dark"] #edges{mix-blend-mode:screen}
  .region .card{transition:fill .25s ease,stroke .25s ease}
  .region{cursor:move}
  .rlabel{cursor:pointer}
  .nlbl{pointer-events:none;stroke-linejoin:round;paint-order:stroke;font-family:var(--font)}
  .rtitle{fill:var(--ink-2);font-weight:600;letter-spacing:.01em}
  .rmeta{fill:var(--ink-3);font-variant-numeric:tabular-nums}
  .rindex{fill:var(--ink-3);font-family:var(--mono);letter-spacing:.08em;opacity:.7}

  /* ---------------------------------------------------------------- chrome */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:30;height:72px;
    display:flex;align-items:center;gap:16px;padding:0 20px;pointer-events:none;
  }
  .topbar>*{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:11px;flex:none}
  .brand .mark{
    width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:linear-gradient(145deg,#4a63e8,#7b5cff 70%);
    box-shadow:0 6px 18px rgba(74,99,232,.32), inset 0 1px 0 rgba(255,255,255,.35);
    color:#fff;
  }
  .brand .mark svg{display:block}
  .brand h1{font-size:14.5px;font-weight:650;letter-spacing:-.01em;margin:0;white-space:nowrap}
  .brand p{margin:1px 0 0;font-size:9.5px;font-weight:650;letter-spacing:.17em;
           text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
  .stats{display:flex;align-items:center;gap:7px;color:var(--ink-3);font-size:11.5px;
         font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:4px}
  .stats b{color:var(--ink-2);font-weight:600}
  .stats i{display:block;width:3px;height:3px;border-radius:50%;background:var(--line-2)}
  .search{
    position:relative;margin-left:auto;width:min(400px,32vw);flex:0 1 400px;
    display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;
    border:1px solid var(--line);border-radius:12px;background:var(--glass);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);
    transition:border-color .18s,box-shadow .18s;
  }
  .search:focus-within{border-color:var(--line-2);box-shadow:var(--shadow),0 0 0 3px var(--accent-soft)}
  .search svg{flex:none;color:var(--ink-3)}
  .search input{
    flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);
    font:inherit;font-size:13px;letter-spacing:.01em;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search kbd{
    flex:none;font:600 10px/1 var(--mono);color:var(--ink-3);
    border:1px solid var(--line);border-radius:5px;padding:3px 5px;background:var(--glass-2);
  }
  .results{
    position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:35;
    padding:6px;border:1px solid var(--line);border-radius:14px;
    background:var(--glass-2);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    box-shadow:var(--shadow-lg);max-height:min(360px,60vh);overflow:auto;display:none;
  }
  .results.on{display:block}
  .results button{
    display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border:0;border-radius:9px;
    background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;
  }
  .results button[aria-selected="true"],.results button:hover{background:var(--hover)}
  .results .rn{flex:1;min-width:0;font-size:12.5px;line-height:1.35;overflow:hidden;
               text-overflow:ellipsis;white-space:nowrap}
  .results .rm{flex:none;font-size:10.5px;color:var(--ink-3)}
  .results .empty{padding:10px;color:var(--ink-3);font-size:12px}
  .actions{display:flex;gap:8px;flex:none}
  .iconbtn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--glass);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);
    color:var(--ink-2);display:grid;place-items:center;cursor:pointer;
    transition:color .16s,background .16s,transform .16s;
  }
  .iconbtn:hover{background:var(--glass-2);color:var(--ink)}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
  .iconbtn svg{display:block}

  /* ---------------------------------------------------------------- rail */
  .rail{
    position:fixed;left:18px;top:88px;z-index:20;width:230px;max-height:calc(100vh - 118px);
    padding:4px 16px 14px;overflow:auto;overscroll-behavior:contain;
    border:1px solid var(--line);border-radius:18px;
    background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:var(--shadow);
    transition:opacity .22s var(--ease),transform .28s var(--ease);
  }
  .rail.hidden{opacity:0;transform:translateX(-14px);pointer-events:none}
  .rail section{padding:13px 0;border-bottom:1px solid var(--line)}
  .rail section:last-child{border-bottom:0;padding-bottom:2px}
  .rail h3{
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    margin:0 0 9px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink-3);font-weight:650;
  }
  .rail h3 em{font-style:normal;font-size:9px;letter-spacing:.12em;opacity:.65}
  .lay{
    display:flex;align-items:center;gap:8px;width:100%;padding:6px 6px;margin:0 -6px;
    border:0;border-radius:8px;background:none;font:inherit;font-size:12px;color:var(--ink);
    cursor:pointer;text-align:left;transition:opacity .16s,background .16s;
  }
  .lay:hover{background:var(--hover)}
  .lay[aria-pressed="false"]{opacity:.36}
  .lay .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--glass-2)}
  .lay .dot.sq{border-radius:3px}
  .lay .dot.di{transform:rotate(45deg);border-radius:2px}
  .lay .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lay .n{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .relrow{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;margin:0 -6px;
          border:0;border-radius:8px;background:none;font:inherit;font-size:11.5px;color:var(--ink-2);
          cursor:pointer;text-align:left;transition:opacity .16s,background .16s}
  .relrow:hover{background:var(--hover)}
  .relrow[aria-pressed="false"]{opacity:.32}
  .relrow s{display:block;width:18px;height:0;border-top:2px solid currentColor;flex:none;text-decoration:none;border-radius:2px}
  .relrow .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .relrow .n{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .reg{
    display:flex;align-items:center;gap:8px;width:100%;padding:6px 6px;margin:0 -6px;
    border:0;border-radius:8px;background:none;font:inherit;font-size:12px;color:var(--ink);
    cursor:pointer;text-align:left;
  }
  .reg:hover{background:var(--hover)}
  .reg .no{font:600 9.5px/1 var(--mono);color:var(--ink-3);letter-spacing:.06em;flex:none;width:16px}
  .reg .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reg .n{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .reg .sw{width:3px;height:14px;border-radius:2px;flex:none}

  /* ---------------------------------------------------------------- hud */
  .hud{position:fixed;left:18px;bottom:18px;z-index:20;display:flex;flex-direction:column;gap:8px}
  .hud .group{
    display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:var(--shadow);
  }
  .hud button{
    width:36px;height:36px;border:0;border-left:1px solid var(--line);background:none;
    color:var(--ink-2);cursor:pointer;display:grid;place-items:center;
    transition:background .15s,color .15s;
  }
  .hud button:first-child{border-left:0}
  .hud button:hover{background:var(--hover);color:var(--ink)}
  .hint{
    position:fixed;left:50%;bottom:19px;transform:translateX(-50%);z-index:10;
    color:var(--ink-3);font-size:11px;letter-spacing:.01em;white-space:nowrap;
    pointer-events:none;user-select:none;
  }
  .hint kbd{font:600 9.5px/1 var(--mono);border:1px solid var(--line);border-radius:4px;
            padding:2px 4px;background:var(--glass);color:var(--ink-3);margin:0 1px}

  /* ---------------------------------------------------------------- drawer */
  .drawer{
    position:fixed;right:18px;top:88px;bottom:18px;z-index:40;width:min(364px,calc(100vw - 36px));
    display:flex;flex-direction:column;overflow:hidden;
    border:1px solid var(--line);border-radius:20px;
    background:var(--glass-2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    box-shadow:var(--shadow-lg);
    transform:translateX(calc(100% + 26px));opacity:0;pointer-events:none;
    transition:transform .4s var(--ease),opacity .28s ease;
  }
  .drawer.on{transform:none;opacity:1;pointer-events:auto}
  .dscroll{padding:18px 20px 22px;overflow:auto;overscroll-behavior:contain;flex:1}
  .dhead{display:flex;align-items:center;gap:8px}
  .dtype{
    display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 7px;border-radius:999px;
    border:1px solid var(--line);background:var(--glass);font-size:10.5px;font-weight:600;
    letter-spacing:.04em;color:var(--ink-2);
  }
  .dtype i{width:7px;height:7px;border-radius:50%;flex:none}
  .dclose{
    margin-left:auto;width:28px;height:28px;border:0;border-radius:8px;background:none;
    color:var(--ink-3);cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1;
  }
  .dclose:hover{background:var(--hover);color:var(--ink)}
  .dtitle{font-size:19px;line-height:1.28;font-weight:650;letter-spacing:-.015em;margin:11px 0 5px;word-break:break-word}
  .dmeta{font-size:11px;color:var(--ink-3);line-height:1.6;word-break:break-all}
  .dmeta code{font-family:var(--mono);font-size:10.5px}
  .dsum{
    margin:14px 0 0;padding:11px 13px;border-radius:11px;
    background:var(--hover);border-left:2px solid var(--accent);
    font-size:12.5px;line-height:1.68;color:var(--ink-2);word-break:break-word;
  }
  .dalso{margin:10px 0 0;font-size:11px;line-height:1.6;color:var(--ink-3);word-break:break-word}
  .dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 2px}
  .dstat{padding:8px 6px;border:1px solid var(--line);border-radius:10px;text-align:center}
  .dstat b{display:block;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3}
  .dstat span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .dgroup{margin-top:18px}
  .dgroup h4{
    display:flex;align-items:center;gap:7px;margin:0 0 7px;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:650;
  }
  .dgroup h4 i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.5}
  .drel{
    display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;margin:0 -8px;
    border:0;border-radius:8px;background:none;font:inherit;color:var(--ink);
    text-align:left;cursor:pointer;
  }
  .drel:hover{background:var(--hover)}
  .drail{width:3px;height:22px;border-radius:2px;flex:none;opacity:.9}
  .drel .r{flex:none;width:66px;font-size:10.5px;color:var(--ink-3);overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
  .drel .t{flex:1;min-width:0;font-size:12px;line-height:1.35;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
  .drel .g{flex:none;color:var(--ink-3);font-size:11px}
  .dfoot{display:flex;gap:8px;margin-top:20px}
  .dbtn{
    flex:1;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--glass);
    color:var(--ink-2);font:inherit;font-size:12px;font-weight:550;cursor:pointer;
    transition:background .16s,color .16s,border-color .16s;
  }
  .dbtn:hover{background:var(--hover);color:var(--ink)}
  .dbtn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .dbtn.primary:hover{filter:brightness(1.06)}
  html[data-theme="dark"] .dbtn.primary{color:#0b0d11}

  /* ---------------------------------------------------------------- tooltip */
  .tip{
    position:fixed;z-index:50;max-width:270px;padding:8px 10px;border:1px solid var(--line);
    border-radius:10px;background:var(--glass-2);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow-lg);
    font-size:11.5px;line-height:1.5;color:var(--ink-2);
    opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
    pointer-events:none;
  }
  .tip.on{opacity:1;transform:none}
  .tip .th{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .tip .th i{width:7px;height:7px;border-radius:50%;flex:none}
  .tip .tm{margin-top:3px;color:var(--ink-3);font-size:10.5px}
  .tip .ts{margin-top:6px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;
           -webkit-box-orient:vertical;overflow:hidden}

  .blank{
    position:fixed;inset:0;z-index:12;display:none;place-items:center;pointer-events:none;
  }
  .blank.on{display:grid}
  .blank div{pointer-events:auto;text-align:center;color:var(--ink-3);font-size:12.5px;
             padding:22px 26px;border:1px solid var(--line);border-radius:16px;
             background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
  .blank b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:4px}

  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* scrollbars */
  .rail::-webkit-scrollbar,.drawer ::-webkit-scrollbar,.results::-webkit-scrollbar{width:8px;height:8px}
  .rail::-webkit-scrollbar-thumb,.drawer ::-webkit-scrollbar-thumb,.results::-webkit-scrollbar-thumb{
    background:var(--line-2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
  .rail::-webkit-scrollbar-track,.drawer ::-webkit-scrollbar-track,.results::-webkit-scrollbar-track{background:transparent}

  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* entrance */
  body:not(.ready) #world{opacity:0}
  body.ready #world{opacity:1;transition:opacity .5s ease}
  .node{animation:pop .5s var(--ease) backwards}
  @keyframes pop{from{opacity:0}to{opacity:1}}

  @media (max-width:980px){
    .brand p,.stats{display:none}
    .search{width:auto;flex:1;margin-left:8px}
    .rail{width:206px}
    .hint{display:block;bottom:66px;font-size:10.5px}
    .drawer{top:78px}
  }
  @media (max-width:680px){
    .brand h1,.brand p{display:none}
    .brand .mark{width:32px;height:32px;border-radius:10px}
    .topbar{gap:8px;padding:0 10px}
    .iconbtn{width:34px;height:34px}
    .search{height:36px;padding-left:10px}
    .search kbd{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;
                         transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div id="err" hidden style="position:fixed;left:12px;bottom:64px;z-index:999;max-width:70vw;padding:8px 10px;border-radius:8px;background:#fff1f0;color:#a8071a;font:12px/1.5 monospace;box-shadow:0 6px 20px rgba(0,0,0,.15)"></div>
<div id="grid" aria-hidden="true"></div>
<svg id="svg" role="application" aria-label="知识图谱,可缩放、拖动、点击节点查看详情">
  <defs id="defs"></defs>
  <g id="world">
    <g id="regions"></g>
    <g id="edges"></g>
    <g id="nodes"></g>
    <g id="regionLabels"></g>
  </g>
</svg>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <circle cx="12" cy="5" r="2.1"/><circle cx="5" cy="18" r="2.1"/><circle cx="19" cy="18" r="2.1"/>
        <path d="M10.6 6.8 6.4 16M13.4 6.8 17.6 16M7.1 18h9.8" stroke-linecap="round"/>
      </svg>
    </span>
    <div>
      <h1>个人技术知识图谱</h1>
      <p>Field Atlas</p>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" placeholder="搜索节点…" autocomplete="off" spellcheck="false" aria-label="搜索节点">
    <kbd>/</kbd>
    <div class="results" id="results" role="listbox" aria-label="搜索结果"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ 常量 */
const NS = "http://www.w3.org/2000/svg";
const CV = DATA.canvas || {w: 1440, h: 900};
const CW = CV.w, CH = CV.h;
const TYPE_LABEL = {Concept: "概念", Resource: "资料", Implementation: "实现", Claim: "主张", Project: "项目"};
const GAP = 8;
const PAD = 20, HEAD = 30;          // 与 graphify.card_box 同值
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = id => document.getElementById(id);
const svg = $("svg"), world = $("world"), defs = $("defs");
const gRegions = $("regions"), gEdges = $("edges"), gNodes = $("nodes"), gRegionLabels = $("regionLabels");
const drawer = $("drawer"), tip = $("tip"), rail = $("rail");
const resultsEl = $("results"), input = $("q"), statsEl = $("stats");

const svgEl = (tag, attrs) => {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
const dom = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hexRgb = h => {
  h = String(h || "#888").replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgba = (h, a) => { const c = hexRgb(h); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; };

const state = {
  theme: "light",
  hiddenTypes: new Set(),
  hiddenRels: new Set(),
  hover: null,
  selected: null,
  focus: null,
  dragging: false,
  hasMoved: false,
  resultIndex: 0,
  searching: false
};
const cam = {x: 0, y: 0, k: 1};
let anim = null;

const pal = () => state.theme === "dark"
  ? {type: DATA.typeColorDark || DATA.typeColor, rel: DATA.relColorDark || DATA.relColor, dark: true}
  : {type: DATA.typeColor, rel: DATA.relColor, dark: false};
const typeColor = t => pal().type[t] || (pal().dark ? "#7c8494" : "#8a8d96");
const relColor = r => pal().rel[r] || {c: pal().dark ? "#6c7480" : "#b4b7c0", w: 1.1};
const relName = r => (DATA.relLabel && DATA.relLabel[r]) || r;
const typeName = t => TYPE_LABEL[t] || t || "节点";

// 区域是「地点」,颜色是地点的身份;节点颜色才是类型。两套编码不要互相冒充。
// 用 hub id 做哈希,新增/删除别的区域不会让已有区域换色。
const PLACE_LIGHT = ["#4C6EF5", "#0CA678", "#E8890C", "#D6336C", "#7048E8", "#5C6B7A"];
const PLACE_DARK = ["#8DA2FF", "#38D9A9", "#FFB84D", "#FF8FB1", "#B197FC", "#93A1B5"];
function placeColor(cl) {
  const arr = state.theme === "dark" ? PLACE_DARK : PLACE_LIGHT;
  const s = String(cl.hub || cl.label || cl.id);
  let h = 7;
  for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
  return arr[h % arr.length];
}

/* ------------------------------------------------------------------ 模型 */
const nodes = DATA.nodes.map((d, i) => {
  const deg = Math.max(1, Number(d.deg) || 1);
  return Object.assign({}, d, {
    i,
    deg,
    px: d.x * CW,
    py: d.y * CH,
    r: Math.max(5, 3.4 * Math.sqrt(deg))
  });
});
const byId = Object.create(null);
nodes.forEach(n => { byId[n.id] = n; });

const edges = DATA.edges
  .filter(e => byId[e.s] && byId[e.t] && e.s !== e.t)
  .map((e, i) => Object.assign({}, e, {a: byId[e.s], b: byId[e.t], i, curve: 0}));

// 同一对节点之间的多条关系:给每条一个横向偏移,不要画成一条。
const pairs = new Map();
edges.forEach(e => {
  const key = e.s < e.t ? e.s + "|" + e.t : e.t + "|" + e.s;
  const arr = pairs.get(key) || [];
  arr.push(e);
  pairs.set(key, arr);
});
pairs.forEach(arr => {
  arr.forEach((e, i) => { e.curve = (i - (arr.length - 1) / 2) * 24; });
});

const nb = Object.create(null);
nodes.forEach(n => { nb[n.id] = new Set(); });
edges.forEach(e => { nb[e.s].add(e.t); nb[e.t].add(e.s); });

const clusters = (DATA.clusters || []).slice();
const clusterById = new Map(clusters.map(c => [c.id, c]));
const clusterOf = n => clusterById.get(n.comp);
const membersByComp = new Map();
nodes.forEach(n => {
  const arr = membersByComp.get(n.comp) || [];
  arr.push(n);
  membersByComp.set(n.comp, arr);
});

const counts = {type: {}, rel: {}};
nodes.forEach(n => { counts.type[n.type] = (counts.type[n.type] || 0) + 1; });
edges.forEach(e => { counts.rel[e.rel] = (counts.rel[e.rel] || 0) + 1; });

/* ------------------------------------------------------------------ 造型 */
// 形状也编码类型:资源是「文档」(方),概念是「概念」(圆),
// 其余类型在放大后各有自己的轮廓 —— 不依赖颜色也能区分。
function nodeShape(type, r) {
  if (type === "Resource") {
    const s = r * 1.62;
    return svgEl("rect", {x: -s / 2, y: -s / 2, width: s, height: s, rx: r * .4, ry: r * .4});
  }
  if (type === "Implementation") {
    const a = r * 1.28;
    return svgEl("path", {d: "M0 " + (-a) + " L" + a + " 0 L0 " + a + " L" + (-a) + " 0 Z"});
  }
  if (type === "Claim") {
    const a = r * 1.34;
    return svgEl("path", {d: "M0 " + (-a) + " L" + (a * .92) + " " + (a * .74) + " L" + (-a * .92) + " " + (a * .74) + " Z"});
  }
  if (type === "Project") {
    const a = r * 1.2, pts = [];
    for (let i = 0; i < 6; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 3;
      pts.push((a * Math.cos(ang)).toFixed(2) + " " + (a * Math.sin(ang)).toFixed(2));
    }
    return svgEl("polygon", {points: pts.join(" ")});
  }
  return svgEl("circle", {r: r});
}
const shapeClass = t => t === "Resource" ? " sq" : (t === "Implementation" ? " di" : "");

/* ------------------------------------------------------------------ SVG */
const markerByRel = {};
let markerIndex = 0;
function buildDefs() {
  defs.textContent = "";
  markerIndex = 0;
  const rels = Object.keys(pal().rel);
  rels.forEach(rel => {
    const id = "mk-" + (markerIndex++);
    markerByRel[rel] = id;
    const m = svgEl("marker", {
      id: id, viewBox: "0 0 12 12", refX: 9.5, refY: 6,
      markerUnits: "userSpaceOnUse", markerWidth: 9, markerHeight: 9, orient: "auto"
    });
    const p = svgEl("path", {d: "M1 1.5 L10 6 L1 10.5", fill: "none",
                             "stroke-linecap": "round", "stroke-linejoin": "round"});
    p.setAttribute("stroke-width", "1.8");
    p.setAttribute("stroke", relColor(rel).c);
    m.appendChild(p);
    defs.appendChild(m);
  });
}

function buildRegions() {
  clusters.forEach((cl, i) => {
    const g = svgEl("g", {"data-comp": cl.id, class: "region"});
    const rect = svgEl("rect", {class: "card", rx: 20});
    g.appendChild(rect);
    gRegions.appendChild(g);

    const lg = svgEl("g", {"data-comp": cl.id, class: "rlabel"});
    const dot = svgEl("circle", {class: "rdot"});
    const title = svgEl("text", {class: "rtitle"});
    const meta = svgEl("text", {class: "rmeta", "text-anchor": "end"});
    const index = svgEl("text", {class: "rindex", "text-anchor": "end"});
    index.textContent = String(i + 1).padStart(2, "0");
    lg.append(dot, title, meta, index);
    gRegionLabels.appendChild(lg);

    cl.el = {g, rect, lg, dot, title, meta, index};
  });
}

function buildEdges() {
  edges.forEach(e => {
    const path = svgEl("path", {class: "edge", "data-rel": e.rel});
    const rc = relColor(e.rel);
    e.w = rc.w;
    path.setAttribute("stroke", rc.c);
    path.setAttribute("stroke-width", e.w);
    path.setAttribute("opacity", "0.55");
    const stacked = e.a.align === "start" || e.a.align === "end" ||
                    e.b.align === "start" || e.b.align === "end";
    const mk = markerByRel[e.rel];
    e.arrow = !stacked && !!mk;
    if (e.arrow) path.setAttribute("marker-end", "url(#" + mk + ")");
    else path.setAttribute("stroke-width", Math.min(1.2, e.w));
    gEdges.appendChild(path);
    e.el = path;
  });
}

function buildNodes() {
  nodes.forEach(n => {
    const g = svgEl("g", {class: "node", "data-id": n.id});
    g.setAttribute("aria-label", n.full);
    g.style.animationDelay = Math.min(n.i * 11, 420) + "ms";

    const halo = nodeShape(n.type, n.r * 1.45);
    halo.setAttribute("class", "halo");
    halo.setAttribute("fill", "none");
    halo.setAttribute("stroke", typeColor(n.type));
    halo.setAttribute("stroke-width", "1.3");
    halo.setAttribute("opacity", n.deg >= 4 ? ".32" : "0");

    const hit = svgEl("circle", {class: "hit", r: Math.max(n.r + 11, 18)});
    const dot = nodeShape(n.type, n.r);
    dot.setAttribute("class", "dot");
    dot.setAttribute("fill", typeColor(n.type));
    dot.setAttribute("stroke", "var(--bg)");
    dot.setAttribute("stroke-width", "1.6");

    const ring = svgEl("circle", {class: "ring", r: n.r + 6, fill: "none",
                                  stroke: "var(--accent)", "stroke-width": "2", opacity: "0"});
    const label = svgEl("text", {class: "nlbl"});
    label.textContent = n.label;

    g.append(halo, dot, hit, ring, label);
    gNodes.appendChild(g);
    n.el = {g, dot, halo, ring, label, hit};
  });
}

/* ------------------------------------------------------------------ 几何 */
function tier(n) { return n.deg >= 8 ? 2 : (n.type === "Concept" ? 1 : 0); }
function labelSize(n) { return n.deg >= 8 ? 13.5 : (n.type === "Concept" ? 12.5 : 11.5); }
function labelWeight(n) { return n.deg >= 8 ? 650 : (n.type === "Concept" ? 550 : 450); }

// 标签宽度用 canvas 实测,不再拿 0.55em 猜西文宽度 —— 猜窄了就会出现
// "VLM AgentVISTA" 这种粘在一起的标签。中文、西文、字重都交给浏览器。
const FONT_STACK = (() => {
  try { return getComputedStyle(document.body).fontFamily || "system-ui, sans-serif"; }
  catch (e) { return "system-ui, sans-serif"; }
})();
const _mctx = (() => {
  try { return document.createElement("canvas").getContext("2d"); } catch (e) { return null; }
})();
const _mcache = new Map();

function labelWidth(text, fs) {
  text = String(text);
  const key = (Math.round(fs * 100) / 100) + "|" + text;
  const hit = _mcache.get(key);
  if (hit != null) return hit;
  let w = 0;
  if (_mctx) {
    try {
      _mctx.font = "500 " + fs + "px " + FONT_STACK;
      w = _mctx.measureText(text).width;
    } catch (e) { w = 0; }
  }
  if (!w || !isFinite(w)) {
    for (const ch of text) w += (ch.codePointAt(0) > 0x2e80 ? 1.0 : 0.55) * fs;
  } else {
    w *= 1.03;   // 600 字重比 500 略宽,留一点余量
  }
  if (_mcache.size > 3000) _mcache.clear();
  _mcache.set(key, w);
  return w;
}

// 标签几何:同一个节点允许放在下面或上面。默认在下面;下面挤了就翻到上面,
// 比「隐藏一个名字」更保留信息。卡片会跟着 n.lbSide 把标签包进去。
function labelGeom(n, side) {
  const size = labelSize(n), fs = size / cam.k, gap = GAP / cam.k;
  const w = labelWidth(n.label, size) / cam.k;
  let dx = 0, dy, anchor = "middle";
  if (n.align === "start") { anchor = "start"; dx = n.r + gap; dy = fs * .34; }
  else if (n.align === "end") { anchor = "end"; dx = -(n.r + gap); dy = fs * .34; }
  else if (side === "above") { dy = -(n.r + gap + fs * .22); }
  else { dy = n.r + gap + fs * .82; }
  let lx1, lx2;
  if (anchor === "middle") { lx1 = n.px - w / 2; lx2 = n.px + w / 2; }
  else { lx1 = n.px + dx - (anchor === "end" ? w : 0); lx2 = lx1 + w; }
  const ly1 = n.py + dy - fs * .78, ly2 = ly1 + fs;
  return {anchor, dx, dy, fs, w, lb: {x1: lx1, y1: ly1, x2: lx2, y2: ly2}};
}

// 节点的「占位」= 圆 + 标签。卡片按它算,所以卡片永远刚好包住文字。
function nodeBox(n) {
  const g = labelGeom(n, n.lbSide || "below");
  return {x1: Math.min(n.px - n.r, g.lb.x1), y1: Math.min(n.py - n.r, g.lb.y1),
          x2: Math.max(n.px + n.r, g.lb.x2), y2: Math.max(n.py + n.r, g.lb.y2),
          anchor: g.anchor, dx: g.dx, dy: g.dy, fs: g.fs, w: g.w, lb: g.lb};
}

const regionBox = new Map();

function drawRegions() {
  // 卡片的 padding/head 用世界坐标(与布局同一套几何),不做屏幕最小值:
  // 一旦屏幕最小值大于拼版留下的 38px 间隙,缩小后卡片就会互相压。
  const pad = PAD, head = HEAD;
  // 缩得很小时标签在世界上会变得很大,卡片不再包住文字;区域名交给 hub 标签。
  const includeLabels = cam.k >= 0.8;
  const showHeader = cam.k >= 0.65;
  clusters.forEach(cl => {
    const members = (membersByComp.get(cl.id) || []).filter(n => !state.hiddenTypes.has(n.type));
    const el = cl.el;
    if (!members.length) {
      el.g.style.display = "none";
      el.lg.style.display = "none";
      regionBox.delete(cl.id);
      return;
    }
    el.g.style.display = "";
    el.lg.style.display = showHeader ? "" : "none";
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    members.forEach(n => {
      // 标签被 LOD/避让隐藏时,卡片不该再为它留位置 —— 否则缩小后卡片会越缩越大。
      const b = (n.lbVisible && includeLabels) ? nodeBox(n)
                            : {x1: n.px - n.r, y1: n.py - n.r, x2: n.px + n.r, y2: n.py + n.r};
      if (b.x1 < x1) x1 = b.x1;
      if (b.y1 < y1) y1 = b.y1;
      if (b.x2 > x2) x2 = b.x2;
      if (b.y2 > y2) y2 = b.y2;
    });
    const box = {x1: x1 - pad, y1: y1 - pad - (showHeader ? head : 0), x2: x2 + pad, y2: y2 + pad};
    regionBox.set(cl.id, box);

    const color = placeColor(cl);
    el.rect.setAttribute("x", box.x1);
    el.rect.setAttribute("y", box.y1);
    el.rect.setAttribute("width", Math.max(70, box.x2 - box.x1));
    el.rect.setAttribute("height", Math.max(56, box.y2 - box.y1));
    el.rect.setAttribute("fill", rgba(color, pal().dark ? ".06" : ".043"));
    el.rect.setAttribute("stroke", rgba(color, pal().dark ? ".30" : ".22"));
    el.rect.setAttribute("stroke-width", "1");

    const fs = 11.5 / cam.k, fsMeta = 10.5 / cam.k;
    const bx = box.x1 + 16 / cam.k, by = box.y1 + 19 / cam.k;
    el.dot.setAttribute("cx", bx);
    el.dot.setAttribute("cy", by - fs * .28);
    el.dot.setAttribute("r", 3.4 / cam.k);
    el.dot.setAttribute("fill", color);

    // 窄卡片(手机)先让出「N 节点」的位置,再降字号;否则标题只剩 "Machi…"。
    let meta = members.length + " 节点";
    let avail = (box.x2 - box.x1) - (26 / cam.k) - (labelWidth(meta, 10.5) / cam.k) - 24 / cam.k;
    let titleFs = fs;
    if (avail < 56 / cam.k) {
      meta = "";
      titleFs = 10 / cam.k;
      avail = (box.x2 - box.x1) - (22 / cam.k) - 10 / cam.k;
    }
    el.title.setAttribute("x", bx + 10 / cam.k);
    el.title.setAttribute("y", by);
    el.title.setAttribute("font-size", titleFs);
    el.title.textContent = fitText(cl.label, Math.max(avail, 30 / cam.k), titleFs);

    el.meta.setAttribute("x", box.x2 - 14 / cam.k);
    el.meta.setAttribute("y", by);
    el.meta.setAttribute("font-size", fsMeta);
    el.meta.textContent = meta;

    el.index.setAttribute("x", box.x2 - 14 / cam.k);
    el.index.setAttribute("y", box.y2 - 12 / cam.k);
    el.index.setAttribute("font-size", 9.5 / cam.k);
  });
}

function fitText(text, maxW, fs) {
  if (labelWidth(text, fs) <= maxW) return text;
  let out = "";
  for (const ch of String(text)) {
    if (labelWidth(out + ch + "…", fs) > maxW) break;
    out += ch;
  }
  return (out || String(text).slice(0, 1)) + "…";
}

function updateEdges() {
  edges.forEach(e => {
    const a = e.a, b = e.b;
    const dx = b.px - a.px, dy = b.py - a.py;
    const d = Math.hypot(dx, dy);
    if (d < 1.5) { e.el.setAttribute("d", ""); return; }
    const ux = dx / d, uy = dy / d;
    const ra = a.r + 3, rb = b.r + 3;
    const x1 = a.px + ux * ra, y1 = a.py + uy * ra;
    const x2 = b.px - ux * rb, y2 = b.py - uy * rb;
    const mx = (x1 + x2) / 2 - uy * e.curve;
    const my = (y1 + y2) / 2 + ux * e.curve;
    e.el.setAttribute("d", "M" + x1.toFixed(1) + " " + y1.toFixed(1) +
                            " Q" + mx.toFixed(1) + " " + my.toFixed(1) +
                            " " + x2.toFixed(1) + " " + y2.toFixed(1));
  });
}

function placeLabels() {
  // 缩小时至少留下「区域代表」的名字;其余按等级/度数/碰撞择优。
  const visibleNodes = nodes.filter(n => !state.hiddenTypes.has(n.type));
  let minTier = cam.k < .78 ? 1 : 0;
  // 如果类型过滤后只剩 tier 0(例如只留 Resource),不能因为等级线把标签全杀光。
  if (visibleNodes.length) {
    const topTier = visibleNodes.reduce((m, n) => Math.max(m, tier(n)), -1);
    if (topTier < minTier) minTier = Math.max(0, topTier);
  }
  const order = nodes.slice().sort((a, b) => b.deg - a.deg || (a.id < b.id ? -1 : 1));
  const boxes = [];
  const pinned = new Set([state.selected, state.focus].filter(Boolean));
  const shown = new Set();
  const attempted = new Set();
  const pad = 6;                       // 屏幕像素:两个标签至少隔 6px 才不会「粘住」

  // 区域代表:hub 被类型过滤掉时,退回到该区域可见节点里度数最高的那个,
  // 保证「只显示 Resource」时每个区域仍然有名字。
  const reps = new Set();
  clusters.forEach(cl => {
    const ms = (membersByComp.get(cl.id) || []).filter(n => !state.hiddenTypes.has(n.type));
    if (!ms.length) return;
    const hub = byId[cl.hub];
    if (hub && !state.hiddenTypes.has(hub.type) && ms.indexOf(hub) >= 0) reps.add(hub.id);
    else reps.add(ms.reduce((a, b) => (b.deg > a.deg ? b : a)).id);
  });

  // 节点也是障碍物:标签压到别的节点上比「少显示一个名字」更难看。
  const obstacles = [];
  nodes.forEach(n => {
    if (state.hiddenTypes.has(n.type)) return;
    const r = n.r * cam.k + 1.5;
    const x = n.px * cam.k + cam.x, y = n.py * cam.k + cam.y;
    obstacles.push({id: n.id, x1: x - r, y1: y - r, x2: x + r, y2: y + r});
  });

  const screenBox = lb => ({
    x1: lb.x1 * cam.k + cam.x, y1: lb.y1 * cam.k + cam.y,
    x2: lb.x2 * cam.k + cam.x, y2: lb.y2 * cam.k + cam.y
  });
  const hits = (a, b) => !(a.x1 - pad > b.x2 || a.x2 + pad < b.x1 ||
                           a.y1 - pad > b.y2 || a.y2 + pad < b.y1);

  const tryLabel = (n, force) => {
    attempted.add(n.id);
    if (state.hiddenTypes.has(n.type)) { n.el.label.style.display = "none"; n.lbVisible = false; return; }
    const fixedSide = n.align === "start" || n.align === "end";
    const sides = fixedSide ? [null] : ["below", "above"];
    let chosen = null;
    for (const side of sides) {
      const g = labelGeom(n, side);
      const box = screenBox(g.lb);
      let bad = false;
      for (const o of obstacles) {
        if (o.id !== n.id && hits(box, o)) { bad = true; break; }
      }
      if (!bad) {
        for (const q of boxes) {
          if (hits(box, q)) { bad = true; break; }
        }
      }
      if (!bad) { chosen = {side, g, box}; break; }
    }
    // 选中/悬停的标签必须可见:两侧都挤时让位,压在下侧。
    if (!chosen && force) {
      const side = fixedSide ? null : "below";
      const g = labelGeom(n, side);
      chosen = {side, g, box: screenBox(g.lb)};
    }
    if (!chosen) {
      n.el.label.style.display = "none";
      n.lbVisible = false;
      return;
    }
    // 屏幕边缘的标签直接藏掉,而不是让它被裁掉半个字。
    // 选中/悬停的标签例外:相机已经把它带到中心。
    const vw = window.innerWidth, vh = window.innerHeight;
    if (!force && (chosen.box.x1 < 4 || chosen.box.x2 > vw - 4 ||
                   chosen.box.y1 < 76 || chosen.box.y2 > vh - 6)) {
      n.el.label.style.display = "none";
      n.lbVisible = false;
      return;
    }
    const g = chosen.g;
    n.lbSide = chosen.side || n.lbSide || "below";
    n.lbVisible = true;
    n.el.label.style.display = "";
    n.el.label.setAttribute("font-size", g.fs);
    n.el.label.setAttribute("font-weight", labelWeight(n));
    n.el.label.setAttribute("text-anchor", g.anchor);
    n.el.label.setAttribute("transform", "translate(" + g.dx + "," + g.dy + ")");
    n.el.label.setAttribute("stroke", "var(--bg)");
    n.el.label.setAttribute("stroke-width", (3.2 / cam.k) + "px");
    n.el.label.setAttribute("fill", n.deg >= 8 ? "var(--ink)" : (n.type === "Concept" ? "var(--ink)" : "var(--ink-2)"));
    boxes.push(chosen.box);
    shown.add(n.id);
  };

  // 1) 选中的 / 悬停的:一定显示。2) 区域代表:缩小时也不丢地名。
  order.forEach(n => { if (pinned.has(n.id)) tryLabel(n, true); });
  order.forEach(n => { if (!attempted.has(n.id) && reps.has(n.id)) tryLabel(n); });
  // 3) 其余按度数择优;等级不够或预算用完就隐藏。
  let budget = cam.k < .55 ? 90 : 400;
  order.forEach(n => {
    if (attempted.has(n.id)) return;
    if (tier(n) < minTier) { n.el.label.style.display = "none"; n.lbVisible = false; return; }
    if (budget-- <= 0) { n.el.label.style.display = "none"; n.lbVisible = false; return; }
    tryLabel(n);
  });
}

function applyCamera() {
  world.setAttribute("transform", "translate(" + cam.x.toFixed(2) + " " + cam.y.toFixed(2) + ") scale(" + cam.k.toFixed(4) + ")");
}

/* ------------------------------------------------------------------ 高亮 */
function paint() {
  const center = state.hover || state.focus || state.selected;
  const ego = center && byId[center] ? new Set([center, ...nb[center]]) : null;

  nodes.forEach(n => {
    const visible = !state.hiddenTypes.has(n.type);
    n.el.g.style.display = visible ? "" : "none";
    if (!visible) return;
    const on = !ego || ego.has(n.id);
    n.el.g.style.opacity = on ? "1" : (state.focus ? ".10" : ".20");
    n.el.ring.setAttribute("opacity", n.id === state.selected ? "1" : "0");
    n.el.ring.setAttribute("stroke", "var(--accent)");
    n.el.ring.setAttribute("r", n.r + 6);
  });

  edges.forEach(e => {
    const visible = !state.hiddenRels.has(e.rel) &&
                    !state.hiddenTypes.has(e.a.type) && !state.hiddenTypes.has(e.b.type);
    e.el.style.display = visible ? "" : "none";
    if (!visible) return;
    const on = !ego || e.s === center || e.t === center;
    e.el.style.opacity = on ? (ego ? ".95" : ".55") : ".07";
    e.el.setAttribute("stroke-width", on && ego ? (e.w * 1.35).toFixed(2) : e.w);
  });

  clusters.forEach(cl => {
    const el = cl.el;
    if (el.g.style.display === "none") return;
    const members = (membersByComp.get(cl.id) || []).filter(n => !state.hiddenTypes.has(n.type));
    const on = !ego || members.some(n => ego.has(n.id));
    const o = on ? "1" : ".35";
    el.lg.style.opacity = o;
    el.rect.style.opacity = ego && !on ? ".4" : "1";
  });

  const vis = nodes.some(n => !state.hiddenTypes.has(n.type));
  $("blank").classList.toggle("on", !vis);
}

function drawAll() {
  nodes.forEach(n => n.el.g.setAttribute("transform", "translate(" + n.px.toFixed(1) + " " + n.py.toFixed(1) + ")"));
  placeLabels();          // 先定标签可见性,卡片才知道要不要给文字留位置
  drawRegions();
  updateEdges();
  paint();
  applyCamera();
}

/* ------------------------------------------------------------------ 相机 */
function viewport() { return {w: window.innerWidth, h: window.innerHeight}; }

function insets() {
  const railOn = rail && !rail.classList.contains("hidden") && window.innerWidth > 980;
  return {left: railOn ? 262 : 22, right: 22, top: 84, bottom: 66};
}

function fitBounds(b, padScreen) {
  const vp = viewport(), ins = insets();
  const pad = padScreen == null ? 0 : padScreen;
  const L = ins.left + pad, R = vp.w - ins.right - pad;
  const T = ins.top + pad, B = vp.h - ins.bottom - pad;
  const k = clamp(Math.min((R - L) / Math.max(b.w, 1), (B - T) / Math.max(b.h, 1)), 0.08, 2.4);
  const freeX = (R - L) - b.w * k, freeY = (B - T) - b.h * k;
  // 整图适应时,宽扁的内容在竖屏上贴着页头放,而不是浮在正中留一圈空白。
  const topBias = padScreen == null ? Math.min(freeY / 2, 24) : freeY / 2;
  return {
    k,
    x: L + freeX / 2 - b.x * k,
    y: T + topBias - b.y * k
  };
}

// 适应视图用的包围盒:按 k=1 的标签尺寸量,不随当前缩放抖动。
function fitBox() {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9, any = false;
  nodes.forEach(n => {
    if (state.hiddenTypes.has(n.type)) return;
    any = true;
    const size = labelSize(n), w = labelWidth(n.label, size);
    let lx1, lx2, ly1, ly2;
    if (n.align === "start") { lx1 = n.px + n.r + GAP; lx2 = lx1 + w; ly1 = n.py - size * .8; ly2 = n.py + size * .3; }
    else if (n.align === "end") { lx2 = n.px - n.r - GAP; lx1 = lx2 - w; ly1 = n.py - size * .8; ly2 = n.py + size * .3; }
    else { lx1 = n.px - w / 2; lx2 = n.px + w / 2; ly1 = n.py + n.r + GAP; ly2 = ly1 + size; }
    x1 = Math.min(x1, n.px - n.r, lx1); x2 = Math.max(x2, n.px + n.r, lx2);
    y1 = Math.min(y1, n.py - n.r, ly1); y2 = Math.max(y2, n.py + n.r, ly2);
  });
  if (!any) return {x: 0, y: 0, w: CW, h: CH};
  const pad = PAD + HEAD;
  return {x: x1 - pad, y: y1 - pad, w: (x2 - x1) + pad * 2, h: (y2 - y1) + pad * 2};
}

function setCam(next) {
  const changedK = Math.abs(next.k - cam.k) > 1e-4;
  cam.x = next.x; cam.y = next.y; cam.k = next.k;
  applyCamera();
  if (changedK) { placeLabels(); drawRegions(); }
}

function animateTo(target, ms) {
  if (anim) cancelAnimationFrame(anim.raf);
  const from = {x: cam.x, y: cam.y, k: cam.k};
  const dur = reduceMotion ? 0 : (ms == null ? 420 : ms);
  const t0 = performance.now();
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  if (dur === 0) { setCam(target); animateFlush(); return; }
  const step = now => {
    const t = clamp((now - t0) / dur, 0, 1), e = ease(t);
    setCam({x: from.x + (target.x - from.x) * e,
            y: from.y + (target.y - from.y) * e,
            k: from.k + (target.k - from.k) * e});
    if (t < 1) anim = {raf: requestAnimationFrame(step)};
    else { anim = null; animateFlush(); }
  };
  anim = {raf: requestAnimationFrame(step)};
}
function animateFlush() { placeLabels(); drawRegions(); }

function boundsOfRegions() {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9, any = false;
  regionBox.forEach(b => {
    any = true;
    x1 = Math.min(x1, b.x1); y1 = Math.min(y1, b.y1);
    x2 = Math.max(x2, b.x2); y2 = Math.max(y2, b.y2);
  });
  if (!any) return null;
  const pad = 8;
  return {x: x1 - pad, y: y1 - pad, w: x2 - x1 + pad * 2, h: y2 - y1 + pad * 2};
}

function fitAll(animate) {
  // 标签在屏幕上是恒定字号,缩小时区域卡片会比 k=1 时更「胖」;而是否把标签
  // 算进卡片又依赖 k —— 所以迭代两次让两边收敛,并留 28px 给边缘标签。
  const from = {x: cam.x, y: cam.y, k: cam.k};
  let target = fitBounds(fitBox());
  setCam(target);
  for (let i = 0; i < 2; i++) {
    drawRegions();
    const b = boundsOfRegions();
    if (!b) break;
    target = fitBounds(b, 28);
    setCam(target);
  }
  if (animate === false) { drawAll(); return; }
  // 迭代过程不展示:回到起点,再动画到最终视图。
  cam.x = from.x; cam.y = from.y; cam.k = from.k;
  applyCamera();
  placeLabels();
  drawRegions();
  animateTo(target);
}

function zoomAt(factor, cx, cy) {
  state.hasMoved = true;
  const vp = viewport();
  cx = cx == null ? vp.w / 2 : cx;
  cy = cy == null ? vp.h / 2 : cy;
  const k = clamp(cam.k * factor, 0.12, 6);
  animateTo({k, x: cx - (cx - cam.x) * (k / cam.k), y: cy - (cy - cam.y) * (k / cam.k)}, 200);
}

function flyToNode(id, ms) {
  const n = byId[id];
  if (!n) return;
  state.hasMoved = true;
  const vp = viewport(), ins = insets();
  const drawerW = drawer.classList.contains("on") ? 382 : 0;
  const k = clamp(Math.max(cam.k, 1.15), 1.15, 1.9);
  const cx = ins.left + (vp.w - ins.left - ins.right - drawerW) / 2;
  const cy = ins.top + (vp.h - ins.top - ins.bottom) / 2;
  animateTo({k, x: cx - n.px * k, y: cy - n.py * k}, ms == null ? 460 : ms);
}

function fitCluster(id) {
  drawRegions();
  const b = regionBox.get(id);
  if (!b) return;
  state.hasMoved = true;
  const target = fitBounds({x: b.x1, y: b.y1, w: b.x2 - b.x1, h: b.y2 - b.y1}, 40);
  animateTo(target);
}

/* ------------------------------------------------------------------ 详情 */
function openPanel(id) {
  const n = byId[id];
  if (!n) return;
  const seen = new Set([String(n.full || "").toLowerCase(),
                        String(n.label || "").toLowerCase(),
                        String(n.id || "").toLowerCase()]);
  const color = typeColor(n.type);
  const outs = edges.filter(e => e.s === id);
  const ins = edges.filter(e => e.t === id);
  const cl = clusterOf(n);

  drawer.textContent = "";
  const scroll = dom("div", "dscroll");
  const head = dom("div", "dhead");
  const chip = dom("span", "dtype");
  const chipDot = dom("i"); chipDot.style.background = color;
  chip.append(chipDot, document.createTextNode(typeName(n.type)));
  const close = dom("button", "dclose", "×");
  close.type = "button";
  close.setAttribute("aria-label", "关闭详情");
  close.onclick = clearSelection;
  head.append(chip, close);

  const title = dom("h2", "dtitle", n.full || n.label);
  const meta = dom("p", "dmeta");
  const code = dom("code", null, n.id);
  meta.append(code, document.createTextNode(cl ? " · " + cl.label + " 区域" : ""));

  scroll.append(head, title, meta);

  if (n.summary) scroll.append(dom("p", "dsum", n.summary));

  const others = (n.aliases || []).filter(a => {
    const s = String(a || "").trim();
    const low = s.toLowerCase();
    if (!s || s.length < 2 || s.includes(".") || seen.has(low)) return false;
    seen.add(low);
    return true;
  }).slice(0, 4);
  if (others.length) scroll.append(dom("p", "dalso", "又名 · " + others.join(" / ")));

  const stats = dom("div", "dstats");
  [["出边", outs.length], ["入边", ins.length], ["度数", n.deg]].forEach(([label, val]) => {
    const c = dom("div", "dstat");
    c.append(dom("b", null, String(val)), dom("span", null, label));
    stats.appendChild(c);
  });
  scroll.append(stats);

  const group = (label, list, dir) => {
    if (!list.length) return;
    const g = dom("div", "dgroup");
    const h = dom("h4");
    h.append(dom("i"), document.createTextNode(label + " · " + list.length));
    g.appendChild(h);
    list.forEach(e => {
      const target = dir === "out" ? byId[e.t] : byId[e.s];
      if (!target) return;
      const b = dom("button", "drel");
      b.type = "button";
      const rc = relColor(e.rel).c;
      const railEl = dom("span", "drail"); railEl.style.background = rc;
      const r = dom("span", "r", relName(e.rel));
      const t = dom("span", "t", target.full || target.label);
      b.append(railEl, r, t);
      b.onclick = () => selectNode(target.id);
      g.appendChild(b);
    });
    scroll.appendChild(g);
  };
  group("出边", outs, "out");
  group("入边", ins, "in");
  if (!outs.length && !ins.length) {
    const g = dom("div", "dgroup");
    g.append(dom("h4", null, "孤立节点"));
    g.appendChild(dom("p", "dmeta", "还没有任何关系连到这个节点"));
    scroll.appendChild(g);
  }

  const foot = dom("div", "dfoot");
  const focusBtn = dom("button", "dbtn" + (state.focus === id ? "" : " primary"),
                       state.focus === id ? "退出聚焦" : "聚焦此节点");
  focusBtn.type = "button";
  focusBtn.onclick = () => toggleFocus(id);
  const fitBtn = dom("button", "dbtn", "居中");
  fitBtn.type = "button";
  fitBtn.onclick = () => flyToNode(id, 360);
  foot.append(focusBtn, fitBtn);
  scroll.append(foot);

  drawer.append(scroll);
  drawer.classList.add("on");
}

function closePanel() {
  drawer.classList.remove("on");
}

function clearSelection() {
  state.selected = null;
  state.focus = null;
  closePanel();
  paint();
  placeLabels();
  drawRegions();
}

function toggleFocus(id) {
  state.focus = state.focus === id ? null : id;
  state.hasMoved = true;
  paint();
  placeLabels();
  drawRegions();
  if (state.focus) {
    const ids = [id, ...nb[id]];
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
    ids.forEach(i => {
      const n = byId[i];
      x1 = Math.min(x1, n.px - n.r); x2 = Math.max(x2, n.px + n.r);
      y1 = Math.min(y1, n.py - n.r); y2 = Math.max(y2, n.py + n.r);
    });
    const pad = 90;
    const b = {x: x1 - pad, y: y1 - pad, w: (x2 - x1) + pad * 2, h: (y2 - y1) + pad * 2};
    animateTo(fitBounds(b));
  }
  if (state.selected === id) openPanel(id);
}

function selectNode(id, opts) {
  if (!byId[id]) return;
  state.hasMoved = true;
  state.selected = id;
  state.focus = null;
  state.hover = null;      // 选中后详情里已经有全部信息,不要再挂一个悬停浮层
  hideTip();
  openPanel(id);
  paint();
  placeLabels();
  drawRegions();
  if (!opts || opts.fly !== false) flyToNode(id, 420);
}

/* ------------------------------------------------------------------ 搜索 */
function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const out = [];
  nodes.forEach(n => {
    const label = String(n.label || "").toLowerCase();
    const full = String(n.full || "").toLowerCase();
    const id = String(n.id).toLowerCase();
    const aliases = (n.aliases || []).join(" ").toLowerCase();
    let score = 0;
    if (label === q || full === q) score = 100;
    else if (label.startsWith(q)) score = 80;
    else if (full.startsWith(q)) score = 70;
    else if (label.includes(q)) score = 50;
    else if (full.includes(q)) score = 40;
    else if (aliases.includes(q)) score = 30;
    else if (id.includes(q)) score = 20;
    if (score) out.push({n, score});
  });
  out.sort((a, b) => b.score - a.score || b.n.deg - a.n.deg || (a.n.id < b.n.id ? -1 : 1));
  return out.slice(0, 9).map(x => x.n);
}

function showResults(list) {
  resultsEl.textContent = "";
  state.resultIndex = 0;
  if (!list.length) {
    const e = dom("div", "empty", "没有匹配的节点");
    resultsEl.appendChild(e);
  }
  list.forEach((n, i) => {
    const b = dom("button");
    b.type = "button";
    b.setAttribute("role", "option");
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    const dot = dom("i", "dot");
    dot.style.cssText = "width:8px;height:8px;flex:none;border-radius:" + (n.type === "Resource" ? "3px" : "50%") +
                        ";background:" + typeColor(n.type);
    const name = dom("span", "rn", n.full || n.label);
    const meta = dom("span", "rm", typeName(n.type) + " · " + n.deg);
    b.append(dot, name, meta);
    b.onclick = () => chooseResult(n);
    b.onmouseenter = () => { setResultIndex(i); };
    resultsEl.appendChild(b);
  });
  resultsEl.classList.add("on");
  state.searching = true;
}

function setResultIndex(i) {
  const items = resultsEl.querySelectorAll("button");
  if (!items.length) return;
  state.resultIndex = clamp(i, 0, items.length - 1);
  items.forEach((el, j) => el.setAttribute("aria-selected", j === state.resultIndex ? "true" : "false"));
}

function chooseResult(n) {
  resultsEl.classList.remove("on");
  state.searching = false;
  input.blur();
  selectNode(n.id);
}

function hideResults() {
  resultsEl.classList.remove("on");
  state.searching = false;
}

/* ------------------------------------------------------------------ 图例 */
function buildTypeChips() {
  const box = $("typechips");
  box.textContent = "";
  Object.keys(counts.type).sort((a, b) => counts.type[b] - counts.type[a] || (a < b ? -1 : 1)).forEach(t => {
    const b = dom("button", "lay");
    b.type = "button";
    b.setAttribute("aria-pressed", state.hiddenTypes.has(t) ? "false" : "true");
    b.title = typeName(t) + " · " + t;
    const dot = dom("i", "dot" + shapeClass(t));
    dot.style.background = typeColor(t);
    const label = dom("span", "lbl", typeName(t));
    const n = dom("span", "n", String(counts.type[t]));
    b.append(dot, label, n);
    b.onclick = () => {
      if (state.hiddenTypes.has(t)) state.hiddenTypes.delete(t); else state.hiddenTypes.add(t);
      b.setAttribute("aria-pressed", state.hiddenTypes.has(t) ? "false" : "true");
      drawAll();
    };
    box.appendChild(b);
  });
}

function buildRelChips() {
  const box = $("relchips");
  box.textContent = "";
  Object.keys(counts.rel).sort((a, b) => counts.rel[b] - counts.rel[a] || (a < b ? -1 : 1)).forEach(r => {
    const b = dom("button", "relrow");
    b.type = "button";
    b.setAttribute("aria-pressed", state.hiddenRels.has(r) ? "false" : "true");
    b.title = r;
    const s = dom("s");
    s.style.borderColor = relColor(r).c;
    const label = dom("span", "lbl", relName(r));
    const n = dom("span", "n", String(counts.rel[r]));
    b.append(s, label, n);
    b.onclick = () => {
      if (state.hiddenRels.has(r)) state.hiddenRels.delete(r); else state.hiddenRels.add(r);
      b.setAttribute("aria-pressed", state.hiddenRels.has(r) ? "false" : "true");
      paint();
    };
    box.appendChild(b);
  });
}

function buildRegionList() {
  const box = $("regionlist");
  box.textContent = "";
  const order = clusters.slice().sort((a, b) => b.n - a.n || (a.label < b.label ? -1 : 1));
  order.forEach(cl => {
    const b = dom("button", "reg");
    b.type = "button";
    const no = dom("span", "no", String(clusters.indexOf(cl) + 1).padStart(2, "0"));
    const sw = dom("span", "sw");
    sw.style.background = placeColor(cl);
    const label = dom("span", "lbl", cl.label);
    const n = dom("span", "n", String(cl.n));
    b.append(no, sw, label, n);
    b.title = cl.full || cl.label;
    b.onclick = () => { selectNode(cl.hub); fitCluster(cl.id); };
    box.appendChild(b);
  });
}

/* ------------------------------------------------------------------ 主题 */
function applyTheme(theme, save) {
  state.theme = theme === "dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", state.theme);
  if (save) { try { localStorage.setItem("kg-theme", state.theme); } catch (e) {} }
  buildDefs();
  nodes.forEach(n => {
    n.el.dot.setAttribute("fill", typeColor(n.type));
    n.el.halo.setAttribute("stroke", typeColor(n.type));
  });
  edges.forEach(e => {
    const rc = relColor(e.rel);
    e.el.setAttribute("stroke", rc.c);
    e.el.setAttribute("stroke-width", e.w);
    if (e.arrow) e.el.setAttribute("marker-end", "url(#" + markerByRel[e.rel] + ")");
    else e.el.removeAttribute("marker-end");
  });
  buildTypeChips();
  buildRelChips();
  buildRegionList();
  drawAll();
  if (state.selected) openPanel(state.selected);
  const sun = $("btnTheme").querySelector(".ic-sun");
  if (sun) sun.style.opacity = state.theme === "dark" ? ".45" : "1";
}

/* ------------------------------------------------------------------ 交互 */
let drag = null, moved = false, downX = 0, downY = 0, pressedNode = null, pressedHeader = null;

function worldPoint(clientX, clientY) {
  const r = svg.getBoundingClientRect();
  return {x: (clientX - r.left - cam.x) / cam.k, y: (clientY - r.top - cam.y) / cam.k};
}

svg.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  hideTip();
  const nodeEl = ev.target.closest("g[data-id]");
  const regionEl = ev.target.closest("[data-comp]");
  downX = ev.clientX; downY = ev.clientY; moved = false;
  pressedNode = nodeEl ? nodeEl.dataset.id : null;
  pressedHeader = ev.target.closest("g.rlabel") ? Number(ev.target.closest("g.rlabel").dataset.comp) : null;
  if (anim) { cancelAnimationFrame(anim.raf); anim = null; }

  if (nodeEl) {
    const n = byId[nodeEl.dataset.id];
    drag = {type: "node", n, ox: ev.clientX, oy: ev.clientY};
    svg.classList.add("dragging");
  } else if (regionEl) {
    const id = Number(regionEl.dataset.comp);
    const members = nodes.filter(n => n.comp === id && !state.hiddenTypes.has(n.type));
    const start = members.map(n => [n.px, n.py]);
    const w = worldPoint(ev.clientX, ev.clientY);
    drag = {type: "region", members, start, ox: w.x, oy: w.y};
    svg.classList.add("dragging");
  } else {
    drag = {type: "pan", ox: ev.clientX, oy: ev.clientY, x: cam.x, y: cam.y};
    svg.classList.add("panning");
  }
  svg.setPointerCapture(ev.pointerId);
});

let raf = 0;
function schedule(fn) {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; fn(); });
}

svg.addEventListener("pointermove", ev => {
  if (!drag) {
    if (ev.target.closest("g[data-id]")) {
      const id = ev.target.closest("g[data-id]").dataset.id;
      if (state.hover !== id) { state.hover = id; paint(); showTip(id, ev); }
      else moveTip(ev);
    } else if (state.hover) {
      state.hover = null; hideTip(); paint();
    }
    return;
  }
  const dx = ev.clientX - downX, dy = ev.clientY - downY;
  if (Math.hypot(dx, dy) > 3) moved = true;

  if (drag.type === "pan") {
    cam.x = drag.x + (ev.clientX - drag.ox);
    cam.y = drag.y + (ev.clientY - drag.oy);
    state.hasMoved = true;
    applyCamera();
    return;
  }
  if (drag.type === "node") {
    const p = worldPoint(ev.clientX, ev.clientY);
    drag.n.px = p.x; drag.n.py = p.y;
    schedule(drawAll);
    return;
  }
  if (drag.type === "region") {
    const p = worldPoint(ev.clientX, ev.clientY);
    const mx = p.x - drag.ox, my = p.y - drag.oy;
    drag.members.forEach((n, i) => {
      n.px = drag.start[i][0] + mx;
      n.py = drag.start[i][1] + my;
    });
    schedule(drawAll);
  }
});

function endDrag(ev) {
  if (!drag) return;
  const kind = drag.type;
  const clickEmpty = kind === "pan" && !moved;
  drag = null;
  svg.classList.remove("panning", "dragging");
  if (!moved && pressedNode) {
    selectNode(pressedNode);
  } else if (!moved && pressedHeader != null) {
    fitCluster(pressedHeader);
  } else if (clickEmpty) {
    clearSelection();
  } else {
    drawAll();
    if (kind !== "pan") state.hasMoved = true;
  }
  pressedNode = null;
  pressedHeader = null;
  try { svg.releasePointerCapture(ev.pointerId); } catch (e) {}
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", () => {
  drag = null; pressedNode = null;
  svg.classList.remove("panning", "dragging");
});

svg.addEventListener("pointerleave", () => {
  if (!drag && state.hover) { state.hover = null; hideTip(); paint(); }
});

svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  if (anim) { cancelAnimationFrame(anim.raf); anim = null; }
  const f = Math.exp(-ev.deltaY * 0.0015 * (ev.ctrlKey ? 2.4 : 1));
  const oldK = cam.k;
  const k = clamp(oldK * f, 0.12, 6);
  const ratio = k / oldK;
  state.hasMoved = true;
  cam.x = ev.clientX - (ev.clientX - cam.x) * ratio;
  cam.y = ev.clientY - (ev.clientY - cam.y) * ratio;
  cam.k = k;
  applyCamera();
  placeLabels();
  drawRegions();
}, {passive: false});

svg.addEventListener("dblclick", ev => {
  const regionEl = ev.target.closest("[data-comp]");
  if (regionEl) { fitCluster(Number(regionEl.dataset.comp)); return; }
  fitAll();
});

/* ------------------------------------------------------------------ tooltip */
function showTip(id, ev) {
  const n = byId[id];
  if (!n || state.selected === id) { hideTip(); return; }
  const cl = clusterOf(n);
  tip.textContent = "";
  const head = dom("div", "th");
  const dot = dom("i");
  dot.style.background = typeColor(n.type);
  dot.style.borderRadius = n.type === "Resource" ? "3px" : "50%";
  head.append(dot, document.createTextNode(n.full || n.label));
  const meta = dom("div", "tm", typeName(n.type) + " · " + n.deg + " 条关系" + (cl ? " · " + cl.label : ""));
  tip.append(head, meta);
  if (n.summary) tip.append(dom("div", "ts", n.summary));
  tip.classList.add("on");
  moveTip(ev);
}
function moveTip(ev) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 16, y = ev.clientY + 16;
  if (x + w + pad > window.innerWidth) x = ev.clientX - w - 16;
  if (y + h + pad > window.innerHeight) y = ev.clientY - h - 16;
  tip.style.left = Math.max(pad, x) + "px";
  tip.style.top = Math.max(pad, y) + "px";
}
function hideTip() { tip.classList.remove("on"); }

/* ------------------------------------------------------------------ UI */
function buildUI() {
  statsEl.textContent = "";
  const add = (b, t) => { statsEl.append(dom("b", null, b), document.createTextNode(" " + t)); };
  add(String(nodes.length), "节点");
  statsEl.append(dom("i"));
  add(String(edges.length), "边");
  statsEl.append(dom("i"));
  add(String(clusters.length), "区域");

  buildTypeChips();
  buildRelChips();
  buildRegionList();
}

$("btnTheme").onclick = () => applyTheme(state.theme === "dark" ? "light" : "dark", true);
$("btnRail").onclick = () => {
  rail.classList.toggle("hidden");
  const on = !rail.classList.contains("hidden");
  $("btnRail").setAttribute("aria-pressed", String(on));
  // 图层栏占了左边一条,还没手动调整视图时重新居中;已经缩放过就保持原样。
  if (!state.hasMoved) fitAll(true); else drawAll();
};
$("zoomIn").onclick = () => zoomAt(1.35);
$("zoomOut").onclick = () => zoomAt(1 / 1.35);
$("zoomFit").onclick = () => fitAll();

input.addEventListener("input", () => {
  const list = search(input.value);
  if (!input.value.trim()) { hideResults(); return; }
  showResults(list);
});
input.addEventListener("focus", () => {
  if (input.value.trim()) showResults(search(input.value));
});
input.addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown") { ev.preventDefault(); setResultIndex(state.resultIndex + 1); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); setResultIndex(state.resultIndex - 1); }
  else if (ev.key === "Enter") {
    ev.preventDefault();
    const list = search(input.value);
    if (list.length) chooseResult(list[state.resultIndex] || list[0]);
  } else if (ev.key === "Escape") {
    ev.preventDefault();
    hideResults();
    input.blur();
  }
});
document.addEventListener("pointerdown", ev => {
  if (!ev.target.closest(".search")) hideResults();
});

document.addEventListener("keydown", ev => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if ((ev.key === "/" || ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k")) && !typing) {
    ev.preventDefault();
    input.focus();
    input.select();
    return;
  }
  if (typing) return;
  if (ev.key === "Escape") {
    if (state.searching) { hideResults(); input.blur(); }
    else if (state.selected) clearSelection();
  } else if (ev.key === "0") { fitAll(); }
  else if (ev.key === "+" || ev.key === "=") { zoomAt(1.3); }
  else if (ev.key === "-" || ev.key === "_") { zoomAt(1 / 1.3); }
  else if (ev.key.toLowerCase() === "t") { applyTheme(state.theme === "dark" ? "light" : "dark", true); }
  else if (ev.key.toLowerCase() === "l") { $("btnRail").click(); }
});

window.addEventListener("resize", () => {
  if (!state.hasMoved) { fitAll(false); drawAll(); }
  else { placeLabels(); drawRegions(); applyCamera(); }
});

/* ------------------------------------------------------------------ boot */
(function boot() {
  const params = new URLSearchParams(location.search);
  const forced = params.get("theme");
  let theme = forced === "dark" ? "dark" : "light";
  if (!forced) {
    try {
      const saved = localStorage.getItem("kg-theme");
      if (saved === "dark" || saved === "light") theme = saved;
      else if (matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
    } catch (e) {
      if (matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
    }
  }
  if (window.innerWidth < 980) {
    rail.classList.add("hidden");
    $("btnRail").setAttribute("aria-pressed", "false");
  }

  // 先按当前主题建元素(buildEdges 需要箭头 defs),再统一上色 + 画第一帧。
  state.theme = theme;
  document.documentElement.setAttribute("data-theme", theme);
  buildDefs();
  buildRegions();
  buildEdges();
  buildNodes();
  buildUI();
  applyTheme(theme, false);

  const focusId = params.get("focus");
  if (focusId && byId[focusId]) state.focus = focusId;
  const start = params.get("node");
  if (start && byId[start]) {
    state.selected = start;
    openPanel(start);
    paint();
    flyToNode(start, 0);
  } else if (window.innerWidth < 700 && clusters.length > 1) {
    // 竖屏整图 fit 只能得到一张很小的地图。默认聚焦最大区域,
    // 其余区域用左下角「适应全图」或图层栏进入 —— 先给一张能读的图。
    const main = clusters.reduce((a, b) => (b.n > a.n ? b : a));
    drawRegions();
    const rb = regionBox.get(main.id);
    if (rb) {
      setCam(fitBounds({x: rb.x1, y: rb.y1, w: rb.x2 - rb.x1, h: rb.y2 - rb.y1}, 40));
      state.hasMoved = true;
    } else {
      fitAll(false);
    }
  } else {
    fitAll(false);
  }
  if (window.innerWidth < 980) {
    const hint = document.querySelector(".hint");
    if (hint) hint.textContent = "拖拽平移 · 左下角「适应全图」· 顶部搜索";
  }
  drawAll();
  requestAnimationFrame(() => document.body.classList.add("ready"));
  // 后台标签页/无头截图里 rAF 可能不触发;给一个兜底,别永远停在透明画布。
  setTimeout(() => document.body.classList.add("ready"), 700);
})();
</script>
</body>
